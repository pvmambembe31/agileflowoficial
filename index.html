<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1457d9" />
  <meta name="description" content="AgileFlow — workspace pessoal para gestão de projetos e crescimento profissional." />
  <title>AgileFlow 1.1</title>
  <link rel="stylesheet" href="./styles.css?v=1.1.0-server" />
  <script>
    (() => {
      if (location.hostname.endsWith('.github.io') || location.hostname.endsWith('.netlify.app')) {
        location.replace('https://debian.tail4baef6.ts.net/' + location.search + location.hash);
        return;
      }
      const showBootError = (detail) => {
        const app = document.getElementById('app');
        if (!app || app.childElementCount) return;
        app.innerHTML = `
          <div style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#f6f8fc;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#172033">
            <div style="width:min(620px,100%);background:white;border:1px solid #dce3ef;border-radius:22px;padding:28px;box-shadow:0 18px 50px rgba(20,87,217,.10)">
              <div style="font-size:13px;font-weight:800;color:#1457d9;letter-spacing:.08em;text-transform:uppercase">AgileFlow • Servidor Debian</div>
              <h1 style="font-size:28px;margin:10px 0 8px">A interface não conseguiu iniciar.</h1>
              <p style="line-height:1.6;color:#5e687b">Os projetos ficam no servidor Debian. Recarregue a página e, se o problema continuar, verifique a conexão com o servidor.</p>
              <div style="display:flex;flex-wrap:wrap;gap:10px"><button onclick="location.reload()" style="border:0;border-radius:12px;padding:12px 18px;background:#1457d9;color:white;font-weight:800;cursor:pointer">Recarregar AgileFlow</button></div>
              <details style="margin-top:18px"><summary style="cursor:pointer;color:#e83e8c;font-weight:700">Detalhes técnicos</summary><pre style="white-space:pre-wrap;font-size:12px;background:#f6f8fc;padding:12px;border-radius:12px;overflow:auto">${String(detail || 'Erro desconhecido').replace(/[<>&]/g, '')}</pre></details>
            </div>
          </div>`;
      };
      window.addEventListener('error', e => setTimeout(() => showBootError(e.message || e.error), 0));
      window.addEventListener('unhandledrejection', e => setTimeout(() => showBootError(e.reason?.message || e.reason), 0));
      setTimeout(() => {
        const app = document.getElementById('app');
        if (app && !app.childElementCount) showBootError('Tempo limite de inicialização excedido.');
      }, 6000);
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./app.js?v=1.1.0-server"></script>
</body>
</html>
